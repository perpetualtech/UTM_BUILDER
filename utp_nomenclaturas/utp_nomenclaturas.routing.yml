# Contrato de API completo en §7 del SDD. Permisos + CSRF reales desde
# Fase 4 (§9.5): GET usa 'access utp nomenclaturas'; mutaciones del árbol/
# UTM/export usan 'edit utp nomenclaturas'; mutaciones de Config (listas,
# condicionales, matriz D4) usan 'administer utp nomenclaturas config'.
# Toda ruta no-GET exige `_csrf_request_header_token: 'TRUE'` (header
# `X-CSRF-Token`, ver AppController/http.ts).

utp_nomenclaturas.config:
  path: '/api/utp-nomenclaturas/v1/config'
  defaults:
    _controller: '\Drupal\utp_nomenclaturas\Controller\UtmConfigController::getConfig'
  methods: [GET]
  requirements:
    _permission: 'access utp nomenclaturas'

