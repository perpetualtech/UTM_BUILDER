# Constantes UTM — Anexo B del SDD, verbatim (verificado 1:1 contra UTP-Nomenclaturas.html).
# Usadas por UtmDeriver en Fase 3 (§3.4/Anexo D); se siembran ya porque son config estática.
utm_presets:
  meta:
    plat: Meta
    source: facebook
    medium: cpc
    campaign: '{{campaign.name}}'
    term: '{{adset.name}}'
    content: '{{ad.name}}'
    ga4: 'Paid Social'
  tiktok:
    plat: Tiktok
    source: tiktok
    medium: cpc
    campaign: __CAMPAIGN_NAME__
    term: __AID_NAME__
    content: __CID_NAME__
    ga4: 'Paid Social'
  google-search:
    plat: GoogleAds
    source: google
    medium: cpc
    campaign: '{campaignid}'
    term: '{keyword}'
    content: '{creative}'
    ga4: 'Paid Search'
  google-pmax:
    plat: GoogleAds
    source: google
    medium: cpc
    campaign: '{campaignid}'
    term: ''
    content: '{resource group}'
    ga4: 'Cross-network'
  google-demandgen:
    plat: GoogleAds
    source: google
    medium: cpc
    campaign: '{campaignid}'
    term: ''
    content: '{conjuntodeanuncio}'
    ga4: 'Cross-network / Paid'
  google-video:
    plat: GoogleAds
    source: google
    medium: cpv
    campaign: '{campaignid}'
    term: ''
    content: '{creative}'
    ga4: Video
  google-display:
    plat: GoogleAds
    source: google
    medium: cpc
    campaign: '{campaignid}'
    term: '{placement}'
    content: '{creative}'
    ga4: Display
  dv360:
    plat: DV360
    source: dv360
    medium: display
    campaign: HARD
    term: '${CREATIVE_ID}'
    content: '${LINE_ITEM_ID}'
    ga4: Display
  linkedin:
    plat: LinkedIn
    source: linkedin
    medium: cpc
    campaign: HARD
    term: HARD
    content: HARD
    ga4: 'Paid Social'

medio_to_preset:
  Meta: meta
  Tiktok: tiktok
  GoogleAds: google-search
  DV360: dv360
  LinkedIn: linkedin

plat_paste:
  Meta:
    sep: true
    where: 'Meta › Seguimiento › Parámetros de URL (URL limpia en «URL del sitio web»)'
  Tiktok:
    sep: true
    where: 'TikTok › Anuncio › Edit URL parameters (Auto-attach OFF)'
  GoogleAds:
    sep: true
    where: 'Google › Sufijo de la URL final'
  DV360:
    sep: false
    where: 'DV360 › Creative › Landing page URL (URL + parámetros juntos)'
  LinkedIn:
    sep: true
    where: 'LinkedIn › Parámetro de URL del anuncio'

ux_sources:
  - instagram
  - tiktok
  - youtube
  - facebook
  - linkedin
  - whatsapp
  - newsletter
  - email
  - linktree
  - spotify
  - blog
  - influencer

ux_mediums:
  - influencer
  - social
  - referral
  - bio-link
  - email
  - organic
  - affiliate
  - partnership
  - cpc
  - cpm

reserved_src:
